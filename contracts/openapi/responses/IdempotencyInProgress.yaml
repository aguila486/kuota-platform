# Contrato fuente de Kuota Core v1 — response IdempotencyInProgress. Editar aquí; los bundles son derivados (T022, R-13).
description: Solicitud con la misma clave aún en proceso (code `idempotency-request-in-progress`). Al reintentar tras completarse
  se recibe la respuesta original.
headers:
  Retry-After:
    required: true
    description: Segundos a esperar antes de reintentar (1 en 001).
    schema:
      type: integer
      minimum: 1
content:
  application/problem+json:
    schema:
      $ref: ../schemas/Problem.yaml
