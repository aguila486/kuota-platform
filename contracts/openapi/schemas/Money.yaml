# Contrato fuente de Kuota Core v1 — schema Money. Editar aquí; los bundles son derivados (T022, R-13).
type: object
description: 'Monto exacto en unidades mínimas de la moneda (ADR-0007). `amount_minor` es un string canónico (sin ceros a
  la

  izquierda ni `-0`) dentro del dominio simétrico de Money (−9223372036854775807 … 9223372036854775807). El

  patrón solo valida la forma; el servidor rechaza fuera de dominio (incluido −9223372036854775808) o con moneda

  no soportada → 400 `validation-error`.

  '
required:
- amount_minor
- currency
additionalProperties: false
properties:
  amount_minor:
    type: string
    pattern: ^(0|-?[1-9][0-9]{0,18})$
    examples:
    - '150000'
  currency:
    type: string
    pattern: ^[A-Z]{3}$
    examples:
    - MXN
