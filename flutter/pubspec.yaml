# Raíz del workspace Flutter/Dart de Kuota (T080; ADR-0003; D-ENV-01; R-19).
#
# - Pub workspaces: una sola resolución de dependencias y un único `flutter/pubspec.lock` para todos los miembros.
#   Cada miembro declara `resolution: workspace`.
# - SDK fijado por proyecto con FVM (`flutter/.fvmrc`: Flutter 3.50.1, Dart 3.14.0). Usa siempre `fvm flutter …` y
#   `fvm dart …`; la instalación global no se modifica.
# - Melos 8 solo para scripts (sección `melos:`), no para bootstrap ni enlazado: eso lo resuelve pub workspaces.
#   Se ejecuta con `fvm dart run melos run <script>` (dependencia de desarrollo fijada, sin instalación global). Así el
#   PATH de los scripts empieza por el SDK de FVM: `dart`/`flutter` dentro de un script son los fijados, no los
#   globales. Los scripts no invocan `melos` (no hay binario global): usan `exec:` con `packageFilters` y `steps`.
#
# Miembros (T080 en dos etapas, Aprobación 7): 3 apps (T085) y 4 paquetes (`api_client`, T070), más `app_shell`
# (T098, Aprobación 11).
name: kuota_workspace
publish_to: none

environment:
  sdk: ^3.14.0

workspace:
  - apps/admin_web
  - apps/client_mobile
  - apps/collector_mobile
  - packages/api_client
  - packages/app_shell
  - packages/shared_core
  - packages/financial_domain
  - packages/design_system

# Dependencias del paquete raíz: herramientas del workspace (tool/check_deps.dart y sus pruebas) y lints compartidos.
dev_dependencies:
  lints: 6.1.0
  melos: 8.10.1
  path: 1.9.1
  test: 1.32.0
  yaml: 3.1.4

melos:
  scripts:
    analyze:
      description: Análisis estático estricto de todo el workspace (paquetes, apps y tool/).
      run: dart analyze --fatal-infos .
    format:
      description: Comprueba el formato de todo el workspace (falla si algún archivo no está formateado).
      run: dart format --output=none --set-exit-if-changed .
    test:
      description: Todas las pruebas del workspace (paquetes Dart puro, paquetes Flutter y tool/).
      steps:
        - test:dart
        - test:flutter
        - test:tool
    test:dart:
      description: Pruebas de los miembros Dart puro (`dart test`).
      exec: dart test
      packageFilters:
        dirExists: test
        noDependsOn: flutter
    test:flutter:
      description: Pruebas de los miembros que dependen de Flutter (`flutter test`).
      exec: flutter test
      packageFilters:
        dirExists: test
        dependsOn: flutter
    test:tool:
      description: Pruebas de las herramientas del workspace (tool/check_deps.dart, osv_coverage.dart y coverage_gate.dart).
      run: dart test tool/test
    test:financial:
      description: Pruebas de financial_domain: Money (T063) y fixtures compartidos (T059), en la VM y en Chrome.
      exec: dart test
      packageFilters:
        scope: financial_domain
    generate:
      description: Regenera el cliente Dart desde contracts/openapi (T069); lo verifica el job contracts (T071).
      run: >-
        if [ -x ../scripts/contracts/generate-dart-client.sh ]; then ../scripts/contracts/generate-dart-client.sh;
        else echo "PENDIENTE: scripts/contracts/generate-dart-client.sh no existe (T069)"; exit 3; fi
