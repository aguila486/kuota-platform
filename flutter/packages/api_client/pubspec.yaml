# Cliente HTTP de Kuota Core para las apps (T070; R-12; flutter-architecture.md §3).
# - `lib/src/generated/`: código GENERADO desde el bundle de cliente del contrato (scripts/contracts/generate-dart-client.sh,
#   openapi-generator dart-dio + built_value). No se edita a mano: se regenera.
# - `lib/api_client.dart`: API pública escrita a mano (configuración, interceptores de X-Correlation-Id y X-App-Version,
#   mapeo de errores problem+json a `Result`). Ningún interceptor genera `Idempotency-Key` (ADR-0003).
# Dart puro: no depende de Flutter ni de ninguna app. Depende de `shared_core` (Result, AppConfig).
name: api_client
description: Cliente de Kuota Core generado desde el contrato OpenAPI, sin operaciones técnicas (dev-probe).
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.14.0

# Versiones exactas con las que se compiló el spike del generador (T069; research R-12), dentro de los rangos que declara
# el propio generador.
dependencies:
  built_collection: 5.1.2
  built_value: 8.13.0
  dio: 5.11.1
  one_of: 1.5.0
  one_of_serializer: 1.5.0
  shared_core:
    path: ../shared_core

dev_dependencies:
  build_runner: 2.16.2
  built_value_generator: 8.13.0
  test: 1.32.0
  yaml: 3.1.4
