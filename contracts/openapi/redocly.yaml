# Redocly CLI 2 para el contrato de Kuota Core (T023; research R-13).
# Uso desde la raíz: `pnpm contracts:lint` y `pnpm contracts:bundle`.
apis:
  core:
    root: ./kuota-core.v1.yaml

extends:
  - recommended

plugins:
  - ./plugins/kuota-rules.mjs

rules:
  # Reglas propias (plugin kuota): idempotencia, errores RFC 9457 y dinero vía Money.
  kuota/idempotency-key-required: error
  kuota/problem-json-errors: error
  kuota/money-via-ref: error
# Excepciones justificadas del preset recommended (servidor localhost y 4xx en health): en .redocly.lint-ignore.yaml,
# acotadas a las ubicaciones concretas para que la regla siga activa en el resto del contrato.
