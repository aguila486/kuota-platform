openapi: 3.1.0
info:
  title: Kuota Core API
  version: 1.0.0-foundation
  summary: Contrato inicial de la plataforma (feature 001-platform-foundation).
  description: |
    Borrador de diseño de 001. La fuente de verdad versionada se materializa en
    `contracts/openapi/kuota-core.v1.yaml` durante la implementación (Constitución XII).
    Convenciones transversales: errores RFC 9457 (problem+json), `X-Correlation-Id`,
    `Idempotency-Key` en escrituras, dinero como `{amount_minor: string, currency}`,
    `X-App-Version` para compatibilidad de apps.

    Acceso (Constitución §II, tabla Endpoint Access de spec.md): solo `getLiveness`, `getReadiness` y
    `getCompatibility` son públicos (`security: []`). Las operaciones `dev-probe` usan `devTenantContext`, un contexto
    técnico de empresa que NO es autenticación y solo existe en `local`/`testing`. No hay esquema global de seguridad:
    toda operación nueva DEBE declarar `security` explícitamente. Las métricas no forman parte de este contrato
    (research R-21).
  license:
    name: Proprietary
    identifier: LicenseRef-Kuota-Proprietary
servers:
  - url: http://localhost:3000
    description: Local
tags:
  - name: health
    description: Chequeos de vida y disponibilidad (sin versión de API).
  - name: meta
    description: Metadatos de la API y compatibilidad de apps.
  - name: dev-probe
    description: Recurso técnico NO productivo (solo KUOTA_ENV local/testing). Valida aislamiento, idempotencia y auditoría.
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Proceso vivo.
      description: Público (excepción registrada). Solo indica que el proceso responde; no consulta dependencias.
      security: []
      responses:
        '200':
          description: Vivo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivenessStatus' }
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Listo para recibir tráfico (verifica dependencias).
      description: |
        Público (excepción registrada). Solo devuelve el estado agregado y `up`/`down` por dependencia lógica; nunca
        hosts, puertos, versiones ni mensajes de error (el detalle del fallo va solo al log).
      security: []
      responses:
        '200':
          description: Listo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
        '503':
          description: No listo; indica qué dependencia lógica está caída.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
  /v1/meta/compatibility:
    get:
      tags: [meta]
      operationId: getCompatibility
      summary: Versión de API y versión mínima soportada por app.
      description: Público (excepción registrada). Las apps lo consultan antes de autenticarse.
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Información de compatibilidad.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompatibilityInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/dev/probe-items:
    x-kuota-non-production: true
    post:
      tags: [dev-probe]
      operationId: createDevProbeItem
      security:
        - devTenantContext: []
      summary: Crea un registro técnico (idempotente y auditado).
      x-kuota-non-production: true
      x-kuota-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/DevActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevProbeItemCreate' }
      responses:
        '201':
          description: Creado (o respuesta reproducida si `Idempotent-Replayed`).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevProbeItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MissingTenantContext' }
        '409': { $ref: '#/components/responses/IdempotencyInProgress' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
    get:
      tags: [dev-probe]
      operationId: listDevProbeItems
      security:
        - devTenantContext: []
      summary: Lista registros del tenant del contexto (paginación por cursor).
      x-kuota-non-production: true
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/DevActor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de resultados.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevProbeItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MissingTenantContext' }
  /v1/dev/probe-items/{id}:
    x-kuota-non-production: true
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DevActor'
    get:
      tags: [dev-probe]
      operationId: getDevProbeItem
      security:
        - devTenantContext: []
      summary: Obtiene un registro del tenant del contexto.
      x-kuota-non-production: true
      responses:
        '200':
          description: Registro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevProbeItem' }
        '401': { $ref: '#/components/responses/MissingTenantContext' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [dev-probe]
      operationId: updateDevProbeItem
      security:
        - devTenantContext: []
      summary: Actualiza la etiqueta (bloqueo optimista).
      x-kuota-non-production: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevProbeItemUpdate' }
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevProbeItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MissingTenantContext' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
    delete:
      tags: [dev-probe]
      operationId: deleteDevProbeItem
      security:
        - devTenantContext: []
      summary: Elimina un registro del tenant del contexto.
      description: >-
        Operación auditada (US6): exige un actor explícito (`X-Kuota-Dev-Actor` en 001). Sin actor, o con un actor
        inválido, responde 400 `validation-error` sin modificar datos (añadido el 2026-11-23, cierre de US6).
      x-kuota-non-production: true
      responses:
        '204': { description: Eliminado. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MissingTenantContext' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    devTenantContext:
      type: apiKey
      in: header
      name: X-Kuota-Dev-Tenant
      description: |
        Contexto técnico de empresa (UUID). NO es autenticación: no prueba identidad ni permisos. Solo existe en
        `local`/`testing` (R-05); fuera de ellos el módulo no se registra y el arranque aborta si el mecanismo está
        habilitado. Se reemplaza por la identidad real en 002.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: UUID de correlación; si falta, el servidor genera uno y lo devuelve.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave generada por el cliente, única por tenant (recomendado UUID). Se conserva 30 días; una clave expirada se trata como nueva (política de 001).
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: 'Formato `<app>/<semver>+<build>`, p. ej. `collector/1.4.2+120`.'
      schema: { type: string, pattern: '^(admin|collector|client)/\d+\.\d+\.\d+(\+\d+)?$' }
    DevActor:
      name: X-Kuota-Dev-Actor
      in: header
      required: false
      description: SOLO local/testing. Identificador técnico del actor para auditoría.
      schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_.:-]+$' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
  headers:
    CorrelationId:
      description: Identificador de correlación de la solicitud.
      schema: { type: string, format: uuid }
    IdempotentReplayed:
      description: '`true` si la respuesta proviene de una ejecución previa con la misma clave.'
      schema: { type: string, enum: ['true'] }
  responses:
    BadRequest:
      description: Error de validación.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MissingTenantContext:
      description: Falta contexto de tenant (code `tenant-context-required`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No existe en el tenant del contexto (no revela existencia en otros tenants).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyInProgress:
      description: Solicitud con la misma clave aún en proceso (code `idempotency-request-in-progress`). Al reintentar tras completarse se recibe la respuesta original.
      headers:
        Retry-After:
          required: true
          description: Segundos a esperar antes de reintentar (1 en 001).
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyKeyReused:
      description: Clave reutilizada con contenido distinto (code `idempotency-key-reused`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionConflict:
      description: Conflicto de versión optimista (code `version-conflict`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details con extensiones Kuota.
      required: [type, title, status, code, correlation_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Código estable legible por máquina.
          examples: [validation-error, tenant-context-required, not-found, idempotency-key-reused, idempotency-request-in-progress, version-conflict, app-version-unsupported, internal-error]
        correlation_id: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    Money:
      type: object
      description: |
        Monto exacto en unidades mínimas de la moneda (ADR-0007). `amount_minor` es un string canónico (sin ceros a la
        izquierda ni `-0`) dentro del dominio simétrico de Money (−9223372036854775807 … 9223372036854775807). El
        patrón solo valida la forma; el servidor rechaza fuera de dominio (incluido −9223372036854775808) o con moneda
        no soportada → 400 `validation-error`.
      required: [amount_minor, currency]
      additionalProperties: false
      properties:
        amount_minor: { type: string, pattern: '^(0|-?[1-9][0-9]{0,18})$', examples: ['150000'] }
        currency: { type: string, pattern: '^[A-Z]{3}$', examples: ['MXN'] }
    LivenessStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok] }
    ReadinessStatus:
      type: object
      required: [status, checks]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, error] }
        checks:
          type: object
          required: [database]
          additionalProperties: false
          properties:
            database: { $ref: '#/components/schemas/DependencyStatus' }
    DependencyStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [up, down] }
    CompatibilityInfo:
      type: object
      required: [api_version, min_supported, server_time]
      additionalProperties: false
      properties:
        api_version: { type: string, examples: ['1.0.0'] }
        min_supported:
          type: object
          required: [admin, collector, client]
          additionalProperties: false
          properties:
            admin: { type: string }
            collector: { type: string }
            client: { type: string }
        client_supported:
          type: [boolean, 'null']
          description: Si se envió `X-App-Version`, indica si esa versión está soportada.
        server_time: { type: string, format: date-time }
    DevProbeItemCreate:
      type: object
      required: [label]
      additionalProperties: false
      description: No acepta tenant_id; el tenant proviene del contexto (FR-012).
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        sample_amount: { $ref: '#/components/schemas/Money' }
    DevProbeItemUpdate:
      type: object
      required: [label, version]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        version: { type: integer, minimum: 1 }
    DevProbeItem:
      type: object
      required: [id, label, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        sample_amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DevProbeItemPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DevProbeItem' }
        next_cursor: { type: [string, 'null'] }
